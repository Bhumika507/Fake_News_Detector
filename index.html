<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fake News Detector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔍 Fake News Detector</h1>
        <p>Enter the news title below to verify its authenticity.</p>
        
        <form action="/predict" method="POST">
            <textarea name="news_title" placeholder="Paste news title here..." required></textarea>
            <button type="submit" class="btn">Analyze News</button>
        </form>

        <!-- Prediction Result Display -->
        {% if prediction %}
            <div class="result-box {{ 'real' if prediction == 'REAL' else 'fake' }}">
                <h2>Result: {{ prediction }}</h2>
            </div>
        {% endif %}
    </div>
</body>
</html>
